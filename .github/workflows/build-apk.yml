name: Build MotoDashboard Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project
        run: |
          base64 -d MotoDashboard_Lite_Source.zip.b64 > /tmp/source.zip
          unzip -o /tmp/source.zip -d .
          rm MotoDashboard_Lite_Source.zip.b64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MotoDashboard-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
