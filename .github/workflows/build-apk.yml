name: Build MotoDashboard Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          encoded = "".join(pathlib.Path("MotoDashboard_Lite_Source.zip.b64").read_text().split())
          archive = None
          try:
              archive = base64.b64decode(encoded, validate=True)
          except Exception:
              # Repair a single stray character in the uploaded text archive, if present.
              for index in range(len(encoded)):
                  candidate_text = encoded[:index] + encoded[index + 1:]
                  try:
                      candidate = base64.b64decode(candidate_text, validate=True)
                      with zipfile.ZipFile(io.BytesIO(candidate)) as zf:
                          if zf.testzip() is None:
                              archive = candidate
                              break
                  except Exception:
                      continue
          if archive is None:
              raise SystemExit("Source archive is corrupted; no valid ZIP could be recovered.")
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f"ZIP integrity check failed: {bad_member}")
              zf.extractall(".")
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml"):
              if not pathlib.Path(required).is_file():
                  raise SystemExit(f"Missing Android project file: {required}")
          PY
          rm MotoDashboard_Lite_Source.zip.b64

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDashboard-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
