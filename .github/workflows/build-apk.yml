name: Build MotoDashboard Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          encoded = "".join(pathlib.Path("MotoDashboard_Lite_Source.zip.b64").read_text().split())
          archive = None
          try:
              archive = base64.b64decode(encoded, validate=True)
          except Exception:
              for index in range(len(encoded)):
                  candidate_text = encoded[:index] + encoded[index + 1:]
                  try:
                      candidate = base64.b64decode(candidate_text, validate=True)
                      with zipfile.ZipFile(io.BytesIO(candidate)) as zf:
                          if zf.testzip() is None:
                              archive = candidate
                              break
                  except Exception:
                      continue
          if archive is None:
              raise SystemExit("Source archive is corrupted; no valid ZIP could be recovered.")
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f"ZIP integrity check failed: {bad_member}")
              zf.extractall(".")
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml"):
              if not pathlib.Path(required).is_file():
                  raise SystemExit(f"Missing Android project file: {required}")
          PY
          rm MotoDashboard_Lite_Source.zip.b64

      - name: Install full motorcycle dashboard interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='app/src/main/AndroidManifest.xml'
          t=ET.parse(p); r=t.getroot(); a='{http://schemas.android.com/apk/res/android}'
          have={x.get(a+'name') for x in r.findall('uses-permission')}
          for n in ['android.permission.INTERNET','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.ACCESS_NETWORK_STATE']:
              if n not in have: ET.SubElement(r,'uses-permission',{a+'name':n})
          for x in r.find('application').findall('activity'):
              if x.get(a+'name','').endswith('MainActivity'):
                  x.set(a+'screenOrientation','landscape')
                  x.set(a+'configChanges','orientation|screenSize|keyboardHidden')
          ET.indent(t,space='  '); t.write(p,encoding='utf-8',xml_declaration=True)
          PY
          cat > app/src/main/java/com/motodashboard/lite/MainActivity.kt <<'KOTLIN'
          package com.motodashboard.lite
          import android.Manifest
          import android.app.Activity
          import android.content.*
          import android.content.pm.PackageManager
          import android.location.*
          import android.media.AudioManager
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.WindowManager
          import android.webkit.*
          import androidx.core.app.ActivityCompat
          import android.hardware.*
          import java.util.Locale

          class MainActivity: Activity(), LocationListener, SensorEventListener {
            private lateinit var w:WebView
            private lateinit var lm:LocationManager
            private lateinit var sm:SensorManager
            private var last:Location?=null
            private val audio by lazy { getSystemService(AUDIO_SERVICE) as AudioManager }
            override fun onCreate(b:Bundle?){
              super.onCreate(b); requestedOrientation=android.content.pm.ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              window.decorView.systemUiVisibility=5894 or 512 or 1024
              lm=getSystemService(LOCATION_SERVICE) as LocationManager
              sm=getSystemService(SENSOR_SERVICE) as SensorManager
              w=WebView(this); w.settings.javaScriptEnabled=true; w.settings.domStorageEnabled=true
              w.settings.mediaPlaybackRequiresUserGesture=true; w.webChromeClient=WebChromeClient()
              w.webViewClient=WebViewClient(); w.addJavascriptInterface(Bridge(),"Moto")
              setContentView(w); w.loadDataWithBaseURL("https://motodashboard.local/",PAGE,"text/html","UTF-8",null)
              val s=sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR) ?: sm.getDefaultSensor(Sensor.TYPE_ORIENTATION)
              s?.let{sm.registerListener(this,it,SensorManager.SENSOR_DELAY_UI)}
              gps()
            }
            private fun gps(){
              if(ActivityCompat.checkSelfPermission(this,Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                ActivityCompat.requestPermissions(this,arrayOf(Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION),8); return
              }
              try{if(lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) lm.requestLocationUpdates(LocationManager.GPS_PROVIDER,1000,1f,this)
                lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)?.let{onLocationChanged(it)}
              }catch(_:Exception){}
            }
            override fun onRequestPermissionsResult(r:Int,p:Array<out String>,g:IntArray){super.onRequestPermissionsResult(r,p,g);if(r==8&&g.any{it==PackageManager.PERMISSION_GRANTED})gps()else w.evaluateJavascript("gpsOff()",null)}
            override fun onLocationChanged(l:Location){last=l; val speed=if(l.hasSpeed())l.speed*3.6f else 0f
              val js=String.format(Locale.US,"gps(%.7f,%.7f,%.1f,%.1f,%.0f)",l.latitude,l.longitude,speed,if(l.hasAltitude())l.altitude else 0.0,if(l.hasAccuracy())l.accuracy else 0f)
              runOnUiThread{w.evaluateJavascript(js,null)}
            }
            override fun onProviderDisabled(p:String){runOnUiThread{w.evaluateJavascript("gpsOff()",null)}}
            override fun onProviderEnabled(p:String){}
            @Deprecated("Deprecated") override fun onStatusChanged(p:String?,s:Int,e:Bundle?){}
            override fun onSensorChanged(e:SensorEvent){
              val d=if(e.sensor.type==Sensor.TYPE_ROTATION_VECTOR){val m=FloatArray(9);SensorManager.getRotationMatrixFromVector(m,e.values);val o=FloatArray(3);SensorManager.getOrientation(m,o);((Math.toDegrees(o[0].toDouble()).toInt()+360)%360)}else e.values[0].toInt()
              runOnUiThread{w.evaluateJavascript("compass($d)",null)}
            }
            override fun onAccuracyChanged(s:Sensor?,a:Int){}
            inner class Bridge{
              @JavascriptInterface fun media(a:String){val k=when(a){"prev"->KeyEvent.KEYCODE_MEDIA_PREVIOUS;"next"->KeyEvent.KEYCODE_MEDIA_NEXT;"toggle"->KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;else->return}
                sendOrderedBroadcast(Intent(Intent.ACTION_MEDIA_BUTTON).putExtra(Intent.EXTRA_KEY_EVENT,KeyEvent(KeyEvent.ACTION_DOWN,k)),null)
                sendOrderedBroadcast(Intent(Intent.ACTION_MEDIA_BUTTON).putExtra(Intent.EXTRA_KEY_EVENT,KeyEvent(KeyEvent.ACTION_UP,k)),null)
              }
              @JavascriptInterface fun volume(d:Int){audio.adjustStreamVolume(AudioManager.STREAM_MUSIC,if(d>0)AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER,0)}
              @JavascriptInterface fun settings(){startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS))}
            }
            override fun onDestroy(){try{lm.removeUpdates(this);sm.unregisterListener(this)}catch(_:Exception){};w.destroy();super.onDestroy()}
            companion object{
              private const val PAGE="""<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
              *{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1218;color:#eef5f8;font-family:Arial}#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom a{background:#101c25!important;color:white!important}
              .bar,.speed,.player,.tools,.chip{position:absolute;z-index:900;background:#101b24ed;border:1px solid #344754;color:#f3f7fa;box-shadow:0 5px 20px #0007;backdrop-filter:blur(8px)}.bar{top:10px;left:12px;right:12px;height:42px;border-radius:13px;padding:11px 14px;display:flex;justify-content:space-between;font-size:13px}.brand{font-weight:bold;letter-spacing:2px}.speed{bottom:16px;left:14px;width:150px;height:120px;border-radius:18px;text-align:center;padding:10px}.speed small{color:#a9bac4;letter-spacing:1px}.speed b{display:block;font-size:52px;line-height:62px}.speed span{font-size:12px;color:#9eb1bd}.player{bottom:16px;right:14px;width:260px;border-radius:18px;padding:12px}.track{display:flex;align-items:center;gap:10px}.art{width:44px;height:44px;border-radius:12px;background:#263c4b;display:grid;place-items:center;font-size:22px}.song{font-size:13px;font-weight:bold}.sub{font-size:11px;color:#9eb0bb;margin-top:4px}.controls{display:flex;justify-content:space-around;margin-top:10px}.controls button,.tools button,.search button{height:39px;min-width:42px;border:0;border-radius:11px;background:#263a48;color:white;font-size:17px}.controls .play{background:#d9e9ef;color:#14232c}.tools{right:14px;top:64px;border-radius:14px;padding:6px;display:grid;gap:6px}.tools button{height:42px;width:42px}.search{position:absolute;z-index:901;top:62px;left:50%;transform:translateX(-50%);display:flex;gap:5px;width:min(42vw,380px)}.search input{flex:1;min-width:0;border-radius:11px;border:1px solid #344754;background:#101b24ed;color:white;padding:0 12px}.stats{position:absolute;z-index:900;left:175px;bottom:20px;display:flex;gap:6px}.chip{position:static;border-radius:10px;padding:8px 10px;font-size:11px}.green{color:#61e0a9}
              </style></head><body><div id="map"></div><div class="bar"><b class="brand">MOTO<span class="green">DASH</span> LITE</b><span id="clock">--:--</span></div>
              <div class="search"><input id="q" placeholder="Buscar destino"><button onclick="search()">⌕</button></div>
              <div class="tools"><button onclick="center()">◎</button><button onclick="map.zoomIn()">＋</button><button onclick="map.zoomOut()">－</button><button onclick="follow=!follow">⌖</button></div>
              <div class="speed"><small>VELOCIDAD GPS</small><b id="speed">--</b><span>km/h</span></div>
              <div class="stats"><div class="chip" id="gps">GPS buscando</div><div class="chip">ALT <b id="alt">--</b></div><div class="chip">RUMBO <b id="head">--°</b></div><div class="chip">PREC <b id="acc">--</b></div></div>
              <div class="player"><div class="track"><div class="art">♫</div><div><div class="song">Reproductor multimedia</div><div class="sub">Control del audio activo en Android</div></div></div><div class="controls"><button onclick="Moto.media('prev')">|◀</button><button class="play" onclick="Moto.media('toggle')">▶ / Ⅱ</button><button onclick="Moto.media('next')">▶|</button><button onclick="Moto.volume(-1)">－</button><button onclick="Moto.volume(1)">＋</button></div></div>
              <script>const map=L.map('map',{zoomControl:false}).setView([-12.0464,-77.0428],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',referrerPolicy:'strict-origin-when-cross-origin'}).addTo(map);let pin=null,follow=true,lat=null,lon=null;
              function gps(a,b,s,h,c){lat=a;lon=b;document.getElementById('speed').textContent=Math.round(s);document.getElementById('alt').textContent=Math.round(h)+' m';document.getElementById('acc').textContent=Math.round(c)+' m';document.getElementById('gps').textContent='● GPS conectado';document.getElementById('gps').className='chip green';if(!pin)pin=L.circleMarker([a,b],{radius:8,color:'#fff',weight:3,fillColor:'#168fff',fillOpacity:1}).addTo(map);else pin.setLatLng([a,b]);if(follow)map.setView([a,b],Math.max(15,map.getZoom()))}
              function gpsOff(){document.getElementById('gps').textContent='GPS no disponible'}function compass(d){document.getElementById('head').textContent=d+'°'}function center(){if(lat!==null){follow=true;map.setView([lat,lon],16)}else Moto.settings()}map.on('dragstart',()=>follow=false);
              function search(){let q=document.getElementById('q').value.trim();if(!q)return;fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q)).then(r=>r.json()).then(x=>{if(x.length){follow=false;map.setView([+x[0].lat,+x[0].lon],16);L.marker([+x[0].lat,+x[0].lon]).addTo(map).bindPopup(x[0].display_name).openPopup()}else alert('Destino no encontrado')}).catch(()=>alert('Error de conexión'))}document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')search()};function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);</script></body></html>"""
            }
          }
          KOTLIN
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDashboard-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
