name: Build MotoDashboard Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, pathlib, zipfile
          encoded = "".join(pathlib.Path("MotoDashboard_Lite_Source.zip.b64").read_text().split())
          archive = None
          try:
              archive = base64.b64decode(encoded, validate=True)
          except Exception:
              for index in range(len(encoded)):
                  candidate_text = encoded[:index] + encoded[index + 1:]
                  try:
                      candidate = base64.b64decode(candidate_text, validate=True)
                      with zipfile.ZipFile(io.BytesIO(candidate)) as zf:
                          if zf.testzip() is None:
                              archive = candidate
                              break
                  except Exception:
                      continue
          if archive is None:
              raise SystemExit("Source archive is corrupted; no valid ZIP could be recovered.")
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              bad_member = zf.testzip()
              if bad_member:
                  raise SystemExit(f"ZIP integrity check failed: {bad_member}")
              zf.extractall(".")
          for required in ("settings.gradle.kts", "app/build.gradle.kts", "app/src/main/AndroidManifest.xml"):
              if not pathlib.Path(required).is_file():
                  raise SystemExit(f"Missing Android project file: {required}")
          PY
          rm MotoDashboard_Lite_Source.zip.b64

      - name: Install full motorcycle dashboard interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='app/src/main/AndroidManifest.xml'
          t=ET.parse(p); r=t.getroot(); a='{http://schemas.android.com/apk/res/android}'
          have={x.get(a+'name') for x in r.findall('uses-permission')}
          for n in ['android.permission.INTERNET','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.ACCESS_NETWORK_STATE']:
              if n not in have: ET.SubElement(r,'uses-permission',{a+'name':n})
          q=ET.SubElement(r,'queries')
          for pkg in ['com.spotify.music','com.google.android.apps.youtube.music']:
              ET.SubElement(q,'package',{a+'name':pkg})
          app=r.find('application')
          for x in app.findall('activity'):
              if x.get(a+'name','').endswith('MainActivity'):
                  x.set(a+'screenOrientation','landscape')
                  x.set(a+'configChanges','orientation|screenSize|keyboardHidden')
          ET.indent(t,space='  '); t.write(p,encoding='utf-8',xml_declaration=True)
          PY
          cat > app/src/main/java/com/motodashboard/lite/MainActivity.kt <<'KOTLIN'
          package com.motodashboard.lite
          import android.Manifest
          import android.app.Activity
          import android.content.*
          import android.content.pm.PackageManager
          import android.location.*
          import android.media.AudioManager
          import android.speech.tts.TextToSpeech
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.KeyEvent
          import android.view.WindowManager
          import android.webkit.*
          import android.hardware.*
          import java.util.Locale

          class MainActivity: Activity(), LocationListener, SensorEventListener {
            private lateinit var w:WebView
            private lateinit var lm:LocationManager
            private lateinit var sm:SensorManager
            private var last:Location?=null
            private val audio by lazy { getSystemService(AUDIO_SERVICE) as AudioManager }
            private var tts:TextToSpeech?=null
            override fun onCreate(b:Bundle?){
              super.onCreate(b); tts=TextToSpeech(this){status->if(status==TextToSpeech.SUCCESS)tts?.language=java.util.Locale("es","PE")}; requestedOrientation=android.content.pm.ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE
              window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
              window.decorView.systemUiVisibility=5894 or 512 or 1024
              lm=getSystemService(LOCATION_SERVICE) as LocationManager
              sm=getSystemService(SENSOR_SERVICE) as SensorManager
              w=WebView(this); w.settings.javaScriptEnabled=true; w.settings.domStorageEnabled=true
              w.settings.mediaPlaybackRequiresUserGesture=true; w.webChromeClient=WebChromeClient()
              w.webViewClient=WebViewClient(); w.addJavascriptInterface(Bridge(),"Moto")
              setContentView(w); w.loadDataWithBaseURL("https://motodashboard.local/",PAGE,"text/html","UTF-8",null)
              val s=sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR) ?: sm.getDefaultSensor(Sensor.TYPE_ORIENTATION)
              s?.let{sm.registerListener(this,it,SensorManager.SENSOR_DELAY_UI)}
              gps()
            }
            private fun gps(){
              if(checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED){
                requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION),8); return
              }
              try{if(lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) lm.requestLocationUpdates(LocationManager.GPS_PROVIDER,1000,1f,this)
                lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)?.let{onLocationChanged(it)}
              }catch(_:Exception){}
            }
            override fun onRequestPermissionsResult(r:Int,p:Array<out String>,g:IntArray){super.onRequestPermissionsResult(r,p,g);if(r==8&&g.any{it==PackageManager.PERMISSION_GRANTED})gps()else w.evaluateJavascript("gpsOff()",null)}
            override fun onLocationChanged(l:Location){last=l; val speed=if(l.hasSpeed())l.speed*3.6f else 0f
              val js=String.format(Locale.US,"gps(%.7f,%.7f,%.1f,%.1f,%.0f)",l.latitude,l.longitude,speed,if(l.hasAltitude())l.altitude else 0.0,if(l.hasAccuracy())l.accuracy else 0f)
              runOnUiThread{w.evaluateJavascript(js,null)}
            }
            override fun onProviderDisabled(p:String){runOnUiThread{w.evaluateJavascript("gpsOff()",null)}}
            override fun onProviderEnabled(p:String){}
            @Deprecated("Deprecated") override fun onStatusChanged(p:String?,s:Int,e:Bundle?){}
            override fun onSensorChanged(e:SensorEvent){
              val d=if(e.sensor.type==Sensor.TYPE_ROTATION_VECTOR){val m=FloatArray(9);SensorManager.getRotationMatrixFromVector(m,e.values);val o=FloatArray(3);SensorManager.getOrientation(m,o);((Math.toDegrees(o[0].toDouble()).toInt()+360)%360)}else e.values[0].toInt()
              runOnUiThread{w.evaluateJavascript("compass($d)",null)}
            }
            override fun onAccuracyChanged(s:Sensor?,a:Int){}
            inner class Bridge{
              @JavascriptInterface fun media(a:String){val k=when(a){"prev"->KeyEvent.KEYCODE_MEDIA_PREVIOUS;"next"->KeyEvent.KEYCODE_MEDIA_NEXT;"toggle"->KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE;else->return}
                sendOrderedBroadcast(Intent(Intent.ACTION_MEDIA_BUTTON).putExtra(Intent.EXTRA_KEY_EVENT,KeyEvent(KeyEvent.ACTION_DOWN,k)),null)
                sendOrderedBroadcast(Intent(Intent.ACTION_MEDIA_BUTTON).putExtra(Intent.EXTRA_KEY_EVENT,KeyEvent(KeyEvent.ACTION_UP,k)),null)
              }
              @JavascriptInterface fun volume(d:Int){audio.adjustStreamVolume(AudioManager.STREAM_MUSIC,if(d>0)AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER,0)}
              @JavascriptInterface fun settings(){startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS))}
              @JavascriptInterface fun speak(text:String){runOnUiThread{try{tts?.speak(text,TextToSpeech.QUEUE_FLUSH,null,"moto-guidance")}catch(_:Exception){}}}
              @JavascriptInterface fun streaming(app:String){
                val pkg=when(app){"spotify"->"com.spotify.music";"ytmusic"->"com.google.android.apps.youtube.music";else->return}
                try { val launch=Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER).setPackage(pkg).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(launch) }
                catch(_:Exception){ try{startActivity(Intent(Intent.ACTION_VIEW,android.net.Uri.parse("market://details?id="+pkg)))}catch(_:Exception){startActivity(Intent(Intent.ACTION_VIEW,android.net.Uri.parse("https://play.google.com/store/apps/details?id="+pkg)))} }
              }
            }
            override fun onDestroy(){try{lm.removeUpdates(this);sm.unregisterListener(this)}catch(_:Exception){};tts?.stop();tts?.shutdown();w.destroy();super.onDestroy()}
            companion object{
              private const val PAGE="""<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>
              *{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1218;color:#eef5f8;font-family:Arial}#map{position:absolute;inset:0}.leaflet-control-attribution{font-size:9px!important}.leaflet-control-zoom a{background:#101c25!important;color:white!important}
              .bar,.speed,.player,.tools,.chip{position:absolute;z-index:900;background:#101b24ed;border:1px solid #344754;color:#f3f7fa;box-shadow:0 5px 20px #0007;backdrop-filter:blur(8px)}.bar{top:10px;left:12px;right:12px;height:42px;border-radius:13px;padding:11px 14px;display:flex;justify-content:space-between;font-size:13px}.brand{font-weight:bold;letter-spacing:2px}.speed{bottom:16px;left:14px;width:150px;height:120px;border-radius:18px;text-align:center;padding:10px}.speed small{color:#a9bac4;letter-spacing:1px}.speed b{display:block;font-size:52px;line-height:62px}.speed span{font-size:12px;color:#9eb1bd}.player{bottom:16px;right:14px;width:260px;border-radius:18px;padding:12px}.track{display:flex;align-items:center;gap:10px}.art{width:44px;height:44px;border-radius:12px;background:#263c4b;display:grid;place-items:center;font-size:22px}.song{font-size:13px;font-weight:bold}.sub{font-size:11px;color:#9eb0bb;margin-top:4px}.controls{display:flex;justify-content:space-around;margin-top:10px}.controls button,.tools button,.search button{height:39px;min-width:42px;border:0;border-radius:11px;background:#263a48;color:white;font-size:17px}.controls .play{background:#d9e9ef;color:#14232c}.tools{right:14px;top:64px;border-radius:14px;padding:6px;display:grid;gap:6px}.tools button{height:42px;width:42px}.search{position:absolute;z-index:901;top:62px;left:50%;transform:translateX(-50%);display:flex;gap:5px;width:min(42vw,380px)}.search input{flex:1;min-width:0;border-radius:11px;border:1px solid #344754;background:#101b24ed;color:white;padding:0 12px} .stats{position:absolute;z-index:900;left:175px;bottom:20px;display:flex;gap:6px}.chip{position:static;border-radius:10px;padding:8px 10px;font-size:11px}.green{color:#61e0a9}.nav{display:none;position:absolute;z-index:905;top:112px;left:12px;width:min(330px,42vw);max-height:52vh;overflow:auto;border:1px solid #405463;border-radius:15px;background:#0e1922f2;padding:12px;box-shadow:0 6px 22px #0009}.navhead{display:flex;justify-content:space-between;align-items:center}.nav button{background:#2b414f;color:white;border:0;border-radius:9px;padding:7px 12px}.navhead b{font-size:14px}.nav #navsummary{font-size:12px;color:#b6c7d0;margin:8px 0}.step{font-size:12px;padding:8px 4px;border-top:1px solid #344754;color:#e2edf2}.step small{color:#91a5b1}.apps{position:absolute;z-index:900;right:14px;top:64px;display:flex;gap:6px}.apps button{border:1px solid #405463;border-radius:10px;background:#101b24ed;color:white;padding:9px 11px;font-size:12px}
              </style></head><body><div id="map"></div><div class="bar"><b class="brand">MOTO<span class="green">DASH</span> LITE</b><span id="clock">--:--</span></div>
              <div class="search"><input id="q" placeholder="Buscar destino o dirección"><button onclick="search()">⌕</button><button onclick="routeToSelected()">IR</button></div>
              <div id="nav" class="nav"><div class="navhead"><b id="navtitle">Planificar ruta</b><button onclick="closeNav()">×</button></div><div id="navsummary">Busca un destino para calcular tu ruta</div><div id="maneuver"></div><div id="steps"></div></div>
              <div class="apps"><button onclick="Moto.streaming('spotify')">♫ Spotify</button><button onclick="Moto.streaming('ytmusic')">▶ YouTube Music</button></div>
              <div class="tools"><button onclick="center()">◎</button><button onclick="map.zoomIn()">＋</button><button onclick="map.zoomOut()">－</button><button onclick="follow=!follow">⌖</button><button onclick="toggleRide()">●</button><button onclick="saveFavorite()">☆</button><button onclick="showFavorites()">★</button><button onclick="exportGPX()">⇩</button><button onclick="document.getElementById('gpxfile').click()">⇧</button><button onclick="toggleSettings()">⚙</button></div>
              <input id="gpxfile" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" style="display:none" onchange="importGPX(this.files[0])">
              <div id="settings" class="nav" style="top:auto;bottom:150px;left:auto;right:65px;width:220px"><b>Panel de conducción</b><p>Alerta de velocidad: <input id="speedLimit" type="number" value="90" min="20" max="180" style="width:65px"></p><button onclick="saveSettings()">Guardar límite</button><button onclick="toggleSettings()">Cerrar</button><div id="rideStats"></div><hr><b>Odómetro y mantenimiento</b><p>Odómetro (km): <input id="odo" type="number" min="0" style="width:75px"></p><p>Último cambio de aceite (km): <input id="oilAt" type="number" min="0" style="width:75px"></p><p>Intervalo (km): <input id="oilEvery" type="number" min="500" value="3000" style="width:75px"></p><button onclick="saveMaintenance()">Guardar mantenimiento</button><div id="maintenanceStatus"></div><p>Último engrase de cadena (km): <input id="chainAt" type="number" min="0" style="width:75px"></p><p>Intervalo cadena (km): <input id="chainEvery" type="number" min="100" value="500" style="width:75px"></p><button onclick="saveMaintenance()">Guardar mantenimiento</button><hr><b>Combustible</b><p>Odómetro actual (km): <input id="fuelOdo" type="number" min="0" style="width:75px"></p><p>Litros: <input id="fuelLiters" type="number" min="0.1" step="0.1" style="width:75px"></p><p>Precio por litro: <input id="fuelPrice" type="number" min="0" step="0.01" style="width:75px"></p><button onclick="saveFuel()">Registrar carga</button><div id="fuelStats"></div><hr><b>Historial de viajes</b><div id="rideHistory"></div><button onclick="resumeRide()">Reanudar borrador</button></div>
              <div class="speed"><small>VELOCIDAD GPS</small><b id="speed">--</b><span>km/h</span></div>
              <div class="stats"><div class="chip" id="gps">GPS buscando</div><div class="chip" id="rideStatus">REC · detenido</div><div class="chip">ALT <b id="alt">--</b></div><div class="chip">RUMBO <b id="head">--°</b></div><div class="chip">PREC <b id="acc">--</b></div></div>
              <div class="player"><div class="track"><div class="art" id="art">♫</div><div style="min-width:0"><div class="song" id="song">Sin reproducción activa</div><div class="sub" id="artist">Conecta Spotify o YouTube Music</div><div class="sub" id="appname">Multimedia Android</div></div></div><div class="controls"><button onclick="Moto.media('prev')">|◀</button><button class="play" onclick="Moto.media('toggle')">▶ / Ⅱ</button><button onclick="Moto.media('next')">▶|</button><button onclick="Moto.volume(-1)">－</button><button onclick="Moto.volume(1)">＋</button></div></div>
              <script>const map=L.map('map',{zoomControl:false}).setView([-12.0464,-77.0428],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',referrerPolicy:'strict-origin-when-cross-origin'}).addTo(map);let pin=null,follow=true,lat=null,lon=null;
              function gps(a,b,s,h,c){lat=a;lon=b;document.getElementById('speed').textContent=Math.round(s);document.getElementById('alt').textContent=Math.round(h)+' m';document.getElementById('acc').textContent=Math.round(c)+' m';document.getElementById('gps').textContent='● GPS conectado';document.getElementById('gps').className='chip green';if(!pin)pin=L.circleMarker([a,b],{radius:8,color:'#fff',weight:3,fillColor:'#168fff',fillOpacity:1}).addTo(map);else pin.setLatLng([a,b]);if(follow)map.setView([a,b],Math.max(15,map.getZoom()));if(rideActive){ridePoints.push({lat:a,lng:b,time:Date.now()});rideMaxSpeed=Math.max(rideMaxSpeed,s);rideSpeedTotal+=s;rideSpeedSamples++;if(ridePoints.length%5===0)localStorage.setItem('motoRideDraft',JSON.stringify(ridePoints))}advanceGuidance(a,b);checkSpeed(s)}
              function gpsOff(){document.getElementById('gps').textContent='GPS no disponible'}function compass(d){document.getElementById('head').textContent=d+'°'}function center(){if(lat!==null){follow=true;map.setView([lat,lon],16)}else Moto.settings()}map.on('dragstart',()=>follow=false);
              let selected=null,routeLayer=null,routeSteps=[],stepIndex=0,selectedMarker=null,rideActive=false,ridePoints=[],rideStart=0,lastGuidance=-1,rideMaxSpeed=0,rideSpeedTotal=0,rideSpeedSamples=0,rideStartedAt=0,speedLimit=Number(localStorage.getItem('motoSpeedLimit')||90),favorites=JSON.parse(localStorage.getItem('motoFavorites')||'[]'),rideHistory=JSON.parse(localStorage.getItem('motoRideHistory')||'[]');
              function mediaInfo(t,a,p){document.getElementById('song').textContent=t;document.getElementById('artist').textContent=a;document.getElementById('appname').textContent=p;document.getElementById('art').textContent='♫'}
              function closeNav(){document.getElementById('nav').style.display='none'}
              function selectPoint(a,b,name){selected={lat:String(a),lon:String(b),display_name:name||('Punto seleccionado · '+a.toFixed(5)+', '+b.toFixed(5))};follow=false;if(selectedMarker)map.removeLayer(selectedMarker);selectedMarker=L.marker([a,b]).addTo(map).bindPopup(selected.display_name).openPopup();document.getElementById('nav').style.display='block';document.getElementById('navtitle').textContent='Destino seleccionado';document.getElementById('navsummary').textContent=selected.display_name;document.getElementById('steps').innerHTML='<button onclick="routeToSelected()">Calcular ruta desde mi ubicación</button>';}
              map.on('click',e=>{const a=e.latlng.lat,b=e.latlng.lng;fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+a+'&lon='+b+'&zoom=18').then(r=>r.json()).then(x=>selectPoint(a,b,x.display_name||'Lugar seleccionado')).catch(()=>selectPoint(a,b,'Lugar seleccionado'));});
              function search(){let q=document.getElementById('q').value.trim();if(!q)return;fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=pe&q='+encodeURIComponent(q)).then(r=>r.json()).then(x=>{if(!x.length){alert('Destino no encontrado');return}selected=x[0];follow=false;map.setView([+selected.lat,+selected.lon],15);L.marker([+selected.lat,+selected.lon]).addTo(map).bindPopup(selected.display_name).openPopup();document.getElementById('nav').style.display='block';document.getElementById('navtitle').textContent='Destino seleccionado';document.getElementById('navsummary').textContent=selected.display_name;document.getElementById('steps').innerHTML='<button onclick="routeToSelected()">Calcular ruta desde mi ubicación</button>'}).catch(()=>alert('Error al buscar. Revisa tu conexión'))}
              function routeToSelected(){if(!selected||lat===null){alert('Espera a que el GPS obtenga tu ubicación y selecciona un destino');return}
                const url='https://router.project-osrm.org/route/v1/driving/'+lon+','+lat+';'+selected.lon+','+selected.lat+'?overview=full&geometries=geojson&steps=true&alternatives=true';
                document.getElementById('navsummary').textContent='Calculando ruta…';
                fetch(url).then(r=>r.json()).then(d=>{if(d.code!=='Ok'||!d.routes.length)throw Error('No hay ruta disponible');
                  const rt=d.routes[0];if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(rt.geometry,{style:{color:'#20a6ff',weight:6,opacity:.9}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[45,45]});
                  routeSteps=rt.legs.flatMap(l=>l.steps).filter(s=>s.distance>1);stepIndex=0;
                  document.getElementById('navsummary').textContent=(rt.distance/1000).toFixed(1)+' km · '+Math.round(rt.duration/60)+' min estimados · Ruta en automóvil';
                  document.getElementById('steps').innerHTML=routeSteps.map((s,i)=>'<div class="step"><b>'+(i+1)+'. '+instruction(s.maneuver,s.name)+'</b><br><small>'+(s.distance>=1000?(s.distance/1000).toFixed(1)+' km':Math.round(s.distance)+' m')+(s.name?' · '+s.name:'')+'</small></div>').join('');
                  showNext();
                }).catch(e=>{document.getElementById('navsummary').textContent='No se pudo calcular la ruta. Intenta nuevamente.';});
              }
              function instruction(m,n){let t=({turn:'Gira','new name':'Continúa',depart:'Inicia la ruta',arrive:'Has llegado',merge:'Incorpórate',roundabout:'En la rotonda',fork:'En la bifurcación','on ramp':'Toma la incorporación','off ramp':'Sal de la vía','end of road':'Al final de la vía'});let s=t[m.type]||'Continúa';if(m.modifier)s+=' '+m.modifier.replace('_',' ');return s+(n?' hacia '+n:'')}
              function showNext(){if(routeSteps.length){let s=routeSteps[Math.min(stepIndex,routeSteps.length-1)];document.getElementById('maneuver').innerHTML='<div style="font-size:17px;font-weight:bold;padding:10px 0">SIGUIENTE: '+instruction(s.maneuver,s.name)+'</div>';}}
              function toggleRide(){if(!rideActive){rideActive=true;ridePoints=[];rideStart=Date.now();rideStartedAt=Date.now();rideMaxSpeed=0;rideSpeedTotal=0;rideSpeedSamples=0;document.getElementById('rideStatus').textContent='REC · grabando';document.getElementById('rideStats').textContent='Grabación iniciada'}else{rideActive=false;const trip={id:Date.now(),date:new Date(rideStart).toISOString(),ended:new Date().toISOString(),points:ridePoints,distance:rideDistance(),duration:Math.max(0,Date.now()-rideStart),maxSpeed:rideMaxSpeed,avgSpeed:rideSpeedSamples?rideSpeedTotal/rideSpeedSamples:0};if(trip.points.length>1){rideHistory.unshift(trip);rideHistory=rideHistory.slice(0,20);localStorage.setItem('motoRideHistory',JSON.stringify(rideHistory));localStorage.setItem('motoLastRide',JSON.stringify(trip));localStorage.removeItem('motoRideDraft')}document.getElementById('rideStatus').textContent='REC · guardado';renderRideHistory();showRideStats(trip)}}
              function showRideStats(t){document.getElementById('rideStats').innerHTML='Distancia: <b>'+t.distance.toFixed(1)+' km</b><br>Duración: <b>'+Math.round(t.duration/60000)+' min</b><br>Velocidad media: <b>'+t.avgSpeed.toFixed(0)+' km/h</b><br>Velocidad máxima: <b>'+t.maxSpeed.toFixed(0)+' km/h</b>'}
              function renderRideHistory(){let e=document.getElementById('rideHistory');if(!e)return;e.innerHTML=rideHistory.length?rideHistory.map((t,i)=>'<div class="step"><b>Viaje '+(i+1)+'</b> · '+new Date(t.date).toLocaleDateString()+'<br>'+t.distance.toFixed(1)+' km · '+Math.round(t.duration/60000)+' min <button onclick="exportTrip('+t.id+')">GPX</button></div>').join(''):'<small>Sin viajes guardados</small>'}
              function exportTrip(id){let t=rideHistory.find(x=>x.id===id);if(t)downloadGPX(t.points,'motodashboard-viaje-'+id+'.gpx')}
              function resumeRide(){let p=JSON.parse(localStorage.getItem('motoRideDraft')||'[]');if(!p.length){alert('No hay un borrador de viaje');return}ridePoints=p;rideActive=true;rideStart=Date.now();document.getElementById('rideStatus').textContent='REC · reanudado';alert('Grabación reanudada. Se conservaron '+p.length+' puntos') }
              function rideDistance(){let d=0;for(let i=1;i<ridePoints.length;i++)d+=map.distance(ridePoints[i-1],ridePoints[i]);return d/1000}
              function saveFavorite(){if(!selected){alert('Selecciona un punto del mapa primero');return}favorites.push({name:selected.display_name,lat:+selected.lat,lon:+selected.lon});localStorage.setItem('motoFavorites',JSON.stringify(favorites));alert('Lugar guardado en favoritos')}
              function showFavorites(){if(!favorites.length){alert('Todavía no tienes lugares guardados');return}let menu=favorites.map((f,i)=>(i+1)+'. '+f.name).join('\n');let n=prompt('Favoritos guardados:\n'+menu+'\n\nEscribe el número del destino');let f=favorites[Number(n)-1];if(f){selectPoint(f.lat,f.lon,f.name);map.setView([f.lat,f.lon],15)}}
              function downloadGPX(pts,name){if(!pts||!pts.length){alert('No hay puntos para exportar');return}let xml='<?xml version="1.0"?><gpx version="1.1" creator="MotoDashboard Lite"><trk><name>Mi recorrido</name><trkseg>'+pts.map(p=>'<trkpt lat="'+(p.lat??p[0])+'" lon="'+(p.lng??p[1])+'"/>').join('')+'</trkseg></trk></gpx>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/gpx+xml'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
              function exportGPX(){let pts=rideActive?ridePoints:(rideHistory[0]?.points|| (routeLayer?routeLayer.getLayers()[0].getLatLngs().flat():[]));downloadGPX(pts,'motodashboard-recorrido.gpx')}
              function importGPX(file){if(!file)return;let r=new FileReader();r.onload=()=>{let doc=new DOMParser().parseFromString(r.result,'application/xml'),pts=[...doc.querySelectorAll('trkpt,rtept,wpt')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(!pts.length){alert('GPX sin puntos válidos');return}if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.polyline(pts,{color:'#20a6ff',weight:6}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});alert('Ruta GPX importada: '+pts.length+' puntos')};r.readAsText(file)}
              function toggleSettings(){let e=document.getElementById('settings');e.style.display=e.style.display==='block'?'none':'block';document.getElementById('speedLimit').value=speedLimit}
              function saveSettings(){speedLimit=Math.max(20,Math.min(180,Number(document.getElementById('speedLimit').value)||90));localStorage.setItem('motoSpeedLimit',speedLimit);alert('Límite guardado: '+speedLimit+' km/h')}
              const maint=JSON.parse(localStorage.getItem('motoMaintenance')||'{"odo":0,"oilAt":0,"oilEvery":3000,"chainAt":0,"chainEvery":500}');
              let fuelLog=JSON.parse(localStorage.getItem('motoFuelLog')||'[]');
              function loadMaintenance(){document.getElementById('odo').value=maint.odo;document.getElementById('oilAt').value=maint.oilAt;document.getElementById('oilEvery').value=maint.oilEvery;document.getElementById('chainAt').value=maint.chainAt||0;document.getElementById('chainEvery').value=maint.chainEvery||500;updateMaintenance();renderFuel()}
              function saveMaintenance(){maint.odo=Math.max(0,Number(document.getElementById('odo').value)||0);maint.oilAt=Math.max(0,Number(document.getElementById('oilAt').value)||0);maint.oilEvery=Math.max(500,Number(document.getElementById('oilEvery').value)||3000);maint.chainAt=Math.max(0,Number(document.getElementById('chainAt').value)||0);maint.chainEvery=Math.max(100,Number(document.getElementById('chainEvery').value)||500);localStorage.setItem('motoMaintenance',JSON.stringify(maint));updateMaintenance()}
              function updateMaintenance(){let due=maint.oilAt+maint.oilEvery,remain=due-maint.odo,cdue=(maint.chainAt||0)+(maint.chainEvery||500),cr=cdue-maint.odo;document.getElementById('maintenanceStatus').innerHTML=(remain<=0?'<b style="color:#ff7777">Aceite vencido por '+Math.abs(remain)+' km</b>':'Aceite: '+remain+' km restantes')+'<br>'+(cr<=0?'<b style="color:#ff7777">Engrasar cadena: vencido por '+Math.abs(cr)+' km</b>':'Cadena: '+cr+' km restantes');}
              function saveFuel(){let o=Number(document.getElementById('fuelOdo').value),l=Number(document.getElementById('fuelLiters').value),p=Number(document.getElementById('fuelPrice').value);if(!o||l<=0||p<0){alert('Ingresa odómetro, litros y precio válidos');return}fuelLog.unshift({date:new Date().toISOString(),odo:o,liters:l,price:p,total:l*p});fuelLog=fuelLog.slice(0,100);localStorage.setItem('motoFuelLog',JSON.stringify(fuelLog));document.getElementById('fuelLiters').value='';document.getElementById('fuelPrice').value='';renderFuel()}
              function renderFuel(){let e=document.getElementById('fuelStats');if(!e)return;if(!fuelLog.length){e.textContent='Sin cargas registradas';return}let total=fuelLog.reduce((s,x)=>s+x.total,0),last=fuelLog[0],prev=fuelLog[1],cons=prev&&last.odo>prev.odo?(last.liters/(last.odo-prev.odo))*100:null;e.innerHTML='Cargas: <b>'+fuelLog.length+'</b> · Gasto acumulado: <b>'+total.toFixed(2)+'</b><br>'+(cons===null?'Registra dos cargas para estimar consumo':'Consumo estimado: <b>'+cons.toFixed(2)+' L/100 km</b>')+'<br><small>El cálculo es orientativo y mejora con cargas completas consecutivas</small>';}
              function advanceGuidance(a,b){if(!routeSteps.length)return;let s=routeSteps[Math.min(stepIndex,routeSteps.length-1)],loc=s.maneuver.location;if(loc){let dist=map.distance([a,b],[loc[1],loc[0]]);if(dist<100&&stepIndex<routeSteps.length-1){stepIndex++;showNext();if(lastGuidance!==stepIndex){Moto.speak(instruction(routeSteps[stepIndex].maneuver,routeSteps[stepIndex].name));lastGuidance=stepIndex}}}}
              function checkSpeed(s){if(s>speedLimit&&window.lastSpeedAlert!==true){Moto.speak('Atención. Superaste el límite de velocidad configurado');window.lastSpeedAlert=true}else if(s<speedLimit-5)window.lastSpeedAlert=false}
              function gps(a,b,s,h,c){lat=a;lon=b;document.getElementById('speed').textContent=Math.round(s);document.getElementById('alt').textContent=Math.round(h)+' m';document.getElementById('acc').textContent=Math.round(c)+' m';document.getElementById('gps').textContent='● GPS conectado';document.getElementById('gps').className='chip green';if(!pin)pin=L.circleMarker([a,b],{radius:8,color:'#fff',weight:3,fillColor:'#168fff',fillOpacity:1}).addTo(map);else pin.setLatLng([a,b]);if(follow)map.setView([a,b],Math.max(15,map.getZoom()));if(rideActive){ridePoints.push({lat:a,lng:b,time:Date.now()});rideMaxSpeed=Math.max(rideMaxSpeed,s);rideSpeedTotal+=s;rideSpeedSamples++;if(ridePoints.length%5===0)localStorage.setItem('motoRideDraft',JSON.stringify(ridePoints))}advanceGuidance(a,b);checkSpeed(s)}document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')search()};function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}renderRideHistory();loadMaintenance();tick();setInterval(tick,1000);</script></body></html>"""
            }
          }
          KOTLIN
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoDashboard-Lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
